<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#2a1408;font-family:'Montserrat',Arial,sans-serif;color:#FFF3E2}
.pic{height:1080px;position:relative}
.pic img{width:1080px;height:1080px;display:block;object-fit:cover}
.pic:after{content:"";position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,#2a1408)}
.txt{position:absolute;top:960px;left:0;right:0;padding:0 70px;text-align:center}
h1{font:900 132px/0.98 'Montserrat';letter-spacing:-.03em;color:#FFB23E;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.frase{margin-top:34px;font:800 54px/1.18 'Montserrat'}
.frase em{font-style:normal;color:#FFB23E}
.ref{margin-top:20px;font:600 42px/1 'Montserrat';color:#F2C89A}
.cuando{margin:52px auto 0;display:inline-block;background:#E8521A;color:#fff;border-radius:28px;padding:26px 54px;font:900 72px/1.1 'Montserrat'}
.cuando small{display:block;font:800 48px/1.2 'Montserrat'}
.donde{margin-top:34px;font:800 46px/1.2 'Montserrat';color:#F2C89A}
</style></head><body>
<div class="pic"><img src="sacerdote.jpg" alt=""></div>
<div class="txt">
  <h1>LEÑA CADA MAÑANA</h1>
  <div class="frase">El fuego lo enciende Dios;<br><em>cuidarlo</em> nos toca a nosotros</div>
  <div class="ref">Levítico 6:12-13</div>
  <div class="cuando"><small>HOY · Domingo 22/11</small>20:30 hs</div>
  <div class="donde">Iglesia El Renuevo · Perico</div>
</div>
</body></html>
