<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: Montserrat, sans-serif; color: #fff; background: #0B1A55; }
  .lienzo { position: relative; width: 1080px; height: 1920px; background: url(fondo_9x16.png) center bottom / cover no-repeat; }
  .arriba { position: absolute; left: 60px; right: 60px; top: 36px; text-align: center; }
  .logo { height: 70px; }
  .kicker { margin-top: 20px; font-size: 46px; font-weight: 800; letter-spacing: 8px; color: #FFB547; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 190px; line-height: .86; margin-top: 28px; }
  .cuando { display: inline-flex; gap: 22px; margin-top: 24px; }
  .chip { background: #FFB547; color: #0B1A55; font-size: 58px; font-weight: 900; padding: 8px 28px; border-radius: 16px; }
  .donde { margin-top: 22px; font-size: 54px; font-weight: 800; }
  .cumple { margin-top: 36px; font-size: 48px; font-weight: 900; color: #FFB547; line-height: 1.1; }
  .cumple small { display: block; font-size: 42px; font-weight: 700; color: #fff; margin-top: 6px; }
  p { margin-top: 26px; font-size: 44px; font-weight: 800; letter-spacing: 1px; }
</style></head>
<body><div class="lienzo">
  <div class="arriba">
    <img class="logo" src="logo_renuevo.png" alt="">
    <div class="kicker">ESTE VIERNES</div>
    <h1>REUNIÓN<br>DE VARONES</h1>
    <div class="cuando"><div class="chip">VIE 13 NOV</div><div class="chip">20:00 HS</div></div>
    <div class="donde">📍 Casa de Juan Quipildor</div>
    <div class="cumple">🎂 ¡Festejamos el cumple de Renzo!<small>(y el atrasado de Misael 😅)</small></div>
    <p>Compartir · Coordinar · Celebrar</p>
  </div>
</div></body></html>
