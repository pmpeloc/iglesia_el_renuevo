<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body, .lienzo { height: 1920px; }
  .lienzo { background-image: url(fondo_9x16.png); }
  .logo { top: 60px; right: 60px; }
  .arriba { top: 130px; }
  .kicker { font-size: 46px; padding: 14px 40px; }
  .pre { font-size: 64px; margin-top: 60px; }
  h1 { font-size: 172px; margin-top: 6px; }
  .cuando { font-size: 58px; margin-top: 50px; }
  .hora { font-size: 220px; padding: 26px 56px; margin-top: 30px; }
  .versiculo { bottom: 230px; padding: 36px 40px; } .versiculo p { font-size: 54px; } .versiculo cite { font-size: 36px; margin-top: 18px; }
  .abajo { font-size: 52px; padding: 46px 20px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="velo"></div>
  <img class="logo" src="logo_renuevo.png" alt="Iglesia El Renuevo">
  <div class="arriba">
    <div class="kicker">HORARIO ESPECIAL</div>
    <div class="pre">Celebramos el</div>
    <h1>Día de la<br>Madre</h1>
    <div class="cuando"><b>HOY</b> · Domingo 25 de octubre</div>
    <div class="hora">19:00 <span>hs</span></div>
  </div>
  <div class="versiculo"><p>“Se levantan sus hijos y la llaman bienaventurada; y su marido también la alaba.”</p><cite>PROVERBIOS 31:28 · RVR1960</cite></div>
  <div class="abajo">¡Las esperamos a todas las mamás!</div>
</div>
</body>
</html>
