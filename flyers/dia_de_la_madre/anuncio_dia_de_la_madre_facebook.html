<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body, .lienzo { height: 1350px; }
  .lienzo { background-image: url(fondo_4x5.png); }
  .logo { top: 40px; right: 40px; width: 84px; }
  .arriba { top: 56px; }
  .kicker { font-size: 38px; padding: 10px 34px; }
  .pre { font-size: 50px; margin-top: 26px; }
  h1 { font-size: 128px; }
  .cuando { font-size: 46px; margin-top: 26px; }
  .hora { font-size: 170px; padding: 20px 46px; margin-top: 22px; }
  .versiculo { bottom: 150px; padding: 24px 34px; } .versiculo p { font-size: 42px; } .versiculo cite { font-size: 30px; margin-top: 12px; }
  .abajo { font-size: 46px; padding: 28px 30px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="velo"></div>
  <img class="logo" src="logo_renuevo.png" alt="Iglesia El Renuevo">
  <div class="arriba">
    <div class="kicker">HORARIO ESPECIAL</div>
    <div class="pre">Celebramos el</div>
    <h1>Día de la Madre</h1>
    <div class="cuando"><b>HOY</b> · Domingo 25 de octubre</div>
    <div class="hora">19:00 <span>hs</span></div>
  </div>
  <div class="versiculo"><p>“Se levantan sus hijos y la llaman bienaventurada; y su marido también la alaba.”</p><cite>PROVERBIOS 31:28 · RVR1960</cite></div>
  <div class="abajo">¡Las esperamos a todas las mamás!</div>
</div>
</body>
</html>
