<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De generación a generación - Loop</title>
  <style>
    :root {
      --cream: #f8f2e2;
      --soft: #d8cfb8;
      --gold: #d7b05b;
      --green: #75ce2f;
      --deep: #0d100b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--deep);
      font-family: Montserrat, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      isolation: isolate;
      color: var(--cream);
      background: #0d100b;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 28%, transparent 72%, rgba(0, 0, 0, 0.38)),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.38) 72%);
    }

    .brand {
      position: absolute;
      top: clamp(22px, 3vw, 52px);
      right: clamp(24px, 3.2vw, 62px);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0.88;
    }

    .brand img {
      width: clamp(76px, 6.2vw, 118px);
      height: clamp(76px, 6.2vw, 118px);
      object-fit: contain;
      filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.42));
    }

    .brand span {
      color: rgba(248, 242, 226, 0.82);
      font-size: clamp(24px, 1.75vw, 34px);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: clamp(68px, 8vw, 132px);
      text-align: center;
    }

    .lockup {
      width: min(1680px, 96vw);
      transform-origin: center;
      animation: presence 30s ease-in-out infinite;
    }

    .kicker {
      margin: 0 0 clamp(22px, 2.4vw, 42px);
      color: rgba(216, 207, 184, 0.84);
      font-size: clamp(30px, 2.25vw, 44px);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .title {
      margin: 0;
      color: var(--cream);
      font-size: clamp(92px, 8.2vw, 158px);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow:
        0 5px 0 rgba(0, 0, 0, 0.1),
        0 20px 58px rgba(0, 0, 0, 0.62);
    }

    .title .accent {
      color: #e2bd66;
    }

    .rule {
      display: block;
      width: min(760px, 62vw);
      height: 5px;
      margin: clamp(34px, 3.4vw, 58px) auto clamp(28px, 2.6vw, 44px);
      background: linear-gradient(90deg, transparent, rgba(117, 206, 47, 0.9), rgba(215, 176, 91, 0.95), transparent);
      box-shadow: 0 0 24px rgba(215, 176, 91, 0.45);
      animation: quiet-glow 30s ease-in-out infinite;
    }

    .subtitle {
      margin: 0;
      color: rgba(248, 242, 226, 0.88);
      font-size: clamp(38px, 3vw, 58px);
      font-weight: 500;
      line-height: 1.22;
      text-shadow: 0 12px 36px rgba(0, 0, 0, 0.52);
    }

    .reference {
      position: absolute;
      left: clamp(28px, 3.5vw, 68px);
      bottom: clamp(26px, 3.2vw, 58px);
      z-index: 3;
      color: rgba(216, 207, 184, 0.72);
      font-size: clamp(28px, 1.9vw, 38px);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 9px 24px rgba(0, 0, 0, 0.5);
    }

    @keyframes presence {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-7px) scale(1.012);
      }
    }

    @keyframes quiet-glow {
      0%,
      100% {
        opacity: 0.78;
        transform: scaleX(0.96);
      }
      50% {
        opacity: 1;
        transform: scaleX(1.05);
      }
    }

    @media (max-width: 900px) {
      .brand span {
        display: none;
      }

      .content {
        padding-inline: 32px;
      }

      .title {
        letter-spacing: 0.035em;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Loop visual De generación a generación">
    <canvas id="motion"></canvas>
    <div class="vignette"></div>
    <div class="brand">
      <img src="../../../logos/LOGO-EL RENUEVO-R-4.png" alt="Iglesia El Renuevo">
      <span>Iglesia El Renuevo</span>
    </div>
    <section class="content">
      <div class="lockup">
        <p class="kicker">Reunión especial</p>
        <h1 class="title">De generación<br><span class="accent">a generación</span></h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="subtitle">Herencia de fe para las nuevas generaciones</p>
      </div>
    </section>
    <div class="reference">Salmo 145:4</div>
  </main>

  <script>
    const canvas = document.getElementById("motion");
    const ctx = canvas.getContext("2d", { alpha: false });
    const LOOP_MS = 30000;

    function makeRandom(seed) {
      let value = seed;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    const random = makeRandom(1454);
    const flecks = Array.from({ length: 120 }, () => ({
      x: random(),
      y: random(),
      size: 0.6 + random() * 2.4,
      alpha: 0.08 + random() * 0.22,
      phase: random(),
      drift: 12 + random() * 34,
      hue: random() > 0.48 ? "gold" : "green"
    }));

    const leaves = Array.from({ length: 18 }, (_, index) => ({
      baseX: 0.13 + random() * 0.74,
      baseY: 0.18 + random() * 0.68,
      size: 18 + random() * 34,
      angle: -0.8 + random() * 1.6,
      phase: index / 18,
      color: random() > 0.55 ? "green" : "gold"
    }));

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    function leafPath(cx, cy, size, angle) {
      const s = size;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.08);
      ctx.bezierCurveTo(s * 0.46, -s * 0.72, s * 1.18, -s * 0.2, s * 1.36, 0);
      ctx.bezierCurveTo(s * 0.9, s * 0.56, s * 0.28, s * 0.42, 0, s * 0.08);
      ctx.bezierCurveTo(s * 0.18, s * 0.02, s * 0.18, -s * 0.02, 0, -s * 0.08);
      ctx.closePath();
      ctx.restore();
    }

    function drawLeaf(cx, cy, size, angle, fill, stroke) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.08);
      ctx.bezierCurveTo(size * 0.46, -size * 0.72, size * 1.18, -size * 0.2, size * 1.36, 0);
      ctx.bezierCurveTo(size * 0.9, size * 0.56, size * 0.28, size * 0.42, 0, size * 0.08);
      ctx.bezierCurveTo(size * 0.18, size * 0.02, size * 0.18, -size * 0.02, 0, -size * 0.08);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    function drawBranch(w, h, p) {
      const sway = Math.sin(p * Math.PI * 2) * 18;
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.strokeStyle = "rgba(216, 176, 91, 0.48)";
      ctx.lineWidth = Math.max(2, w * 0.002);
      ctx.beginPath();
      ctx.moveTo(w * 0.08, h * 0.8);
      ctx.bezierCurveTo(w * 0.28, h * 0.66 + sway, w * 0.39, h * 0.45 - sway * 0.2, w * 0.56, h * 0.38);
      ctx.bezierCurveTo(w * 0.72, h * 0.31, w * 0.82, h * 0.22 + sway * 0.4, w * 0.96, h * 0.14);
      ctx.stroke();

      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "rgba(117, 206, 47, 0.42)";
      ctx.lineWidth = Math.max(1.4, w * 0.0012);
      for (let i = 0; i < 7; i++) {
        const t = i / 6;
        const x = w * (0.18 + t * 0.66);
        const y = h * (0.72 - t * 0.54) + Math.sin((p + t) * Math.PI * 2) * 10;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + w * 0.055, y - h * (0.06 + t * 0.02), x + w * 0.12, y - h * 0.05);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRings(w, h, p) {
      ctx.save();
      ctx.translate(w * 0.5, h * 0.53);
      ctx.rotate(Math.sin(p * Math.PI * 2) * 0.018);
      for (let i = 0; i < 14; i++) {
        const t = i / 13;
        const pulse = Math.sin((p + t * 0.42) * Math.PI * 2) * 10;
        const rx = w * (0.11 + t * 0.31) + pulse;
        const ry = h * (0.06 + t * 0.16) + pulse * 0.22;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.strokeStyle = i % 3 === 0
          ? `rgba(117, 206, 47, ${0.08 + t * 0.08})`
          : `rgba(216, 176, 91, ${0.055 + t * 0.06})`;
        ctx.lineWidth = 1.1 + t * 2;
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFlecks(w, h, p) {
      for (const fleck of flecks) {
        const phase = (p + fleck.phase) * Math.PI * 2;
        const x = fleck.x * w + Math.sin(phase) * fleck.drift;
        const y = fleck.y * h + Math.cos(phase * 0.8) * fleck.drift * 0.55;
        ctx.beginPath();
        ctx.arc(x, y, fleck.size, 0, Math.PI * 2);
        ctx.fillStyle = fleck.hue === "gold"
          ? `rgba(216, 176, 91, ${fleck.alpha})`
          : `rgba(117, 206, 47, ${fleck.alpha * 0.9})`;
        ctx.fill();
      }
    }

    function drawLeaves(w, h, p) {
      for (const item of leaves) {
        const phase = (p + item.phase) * Math.PI * 2;
        const cx = item.baseX * w + Math.sin(phase) * 16;
        const cy = item.baseY * h + Math.cos(phase * 0.7) * 12;
        const angle = item.angle + Math.sin(phase) * 0.08;
        const fill = item.color === "green" ? "rgba(117, 206, 47, 0.12)" : "rgba(216, 176, 91, 0.11)";
        const stroke = item.color === "green" ? "rgba(117, 206, 47, 0.22)" : "rgba(216, 176, 91, 0.22)";
        drawLeaf(cx, cy, item.size, angle, fill, stroke);
      }
    }

    function drawBackground(w, h, p) {
      const shift = Math.sin(p * Math.PI * 2) * 0.06;
      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, "#0c100b");
      gradient.addColorStop(0.34 + shift, "#172515");
      gradient.addColorStop(0.68 - shift, "#2a2217");
      gradient.addColorStop(1, "#10100d");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      const wash = ctx.createRadialGradient(w * 0.5, h * 0.55, 0, w * 0.5, h * 0.55, Math.max(w, h) * 0.62);
      wash.addColorStop(0, "rgba(248, 242, 226, 0.08)");
      wash.addColorStop(0.42, "rgba(117, 206, 47, 0.045)");
      wash.addColorStop(1, "rgba(0, 0, 0, 0.18)");
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, w, h);
    }

    function draw(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const p = (now % LOOP_MS) / LOOP_MS;
      drawBackground(w, h, p);
      drawRings(w, h, p);
      drawBranch(w, h, p);
      drawLeaves(w, h, p);
      drawFlecks(w, h, p);
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
    window.__loopReady = true;
  </script>
</body>
</html>
