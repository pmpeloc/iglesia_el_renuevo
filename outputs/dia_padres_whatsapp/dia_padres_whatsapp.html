<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Día del Padre - Iglesia El Renuevo</title>
  <style>
    :root {
      --green: #5dbe2c;
      --green-soft: #9be15d;
      --gold: #e9c46a;
      --ink: #06100a;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #050807;
    }

    .poster {
      position: relative;
      width: 1080px;
      height: 1920px;
      padding: 92px 86px 76px;
      color: var(--white);
      background:
        radial-gradient(circle at 16% 14%, rgba(93, 190, 44, 0.34), transparent 32%),
        radial-gradient(circle at 84% 20%, rgba(233, 196, 106, 0.18), transparent 30%),
        linear-gradient(165deg, #142418 0%, #07100b 48%, #020403 100%);
      isolation: isolate;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent 58%);
      opacity: 0.45;
      z-index: -2;
    }

    .poster::after {
      content: "";
      position: absolute;
      width: 760px;
      height: 760px;
      right: -260px;
      bottom: -180px;
      border: 2px solid rgba(93, 190, 44, 0.28);
      border-radius: 50%;
      box-shadow:
        0 0 0 86px rgba(93, 190, 44, 0.04),
        0 0 0 176px rgba(233, 196, 106, 0.035);
      z-index: -1;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 28px;
      letter-spacing: 0;
      color: rgba(255, 255, 255, 0.82);
    }

    .badge {
      padding: 14px 24px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      color: var(--green-soft);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
    }

    .content {
      display: flex;
      height: calc(100% - 72px);
      flex-direction: column;
      justify-content: center;
      padding-bottom: 126px;
    }

    .eyebrow {
      margin: 0 0 42px;
      color: var(--gold);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 890px;
      font-size: 142px;
      line-height: 0.93;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 .accent {
      display: block;
      color: var(--green-soft);
    }

    .verse-card {
      margin-top: 96px;
      padding: 46px 44px 42px;
      border-left: 12px solid var(--green);
      background: rgba(255, 255, 255, 0.095);
      box-shadow: 0 34px 90px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(4px);
    }

    .verse {
      margin: 0;
      font-size: 58px;
      line-height: 1.13;
      font-weight: 800;
      letter-spacing: 0;
    }

    .reference {
      margin-top: 28px;
      color: var(--gold);
      font-size: 31px;
      font-weight: 800;
    }

    .challenge {
      width: 89%;
      margin: 78px 0 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 38px;
      line-height: 1.24;
      font-weight: 600;
    }

    .footer {
      position: absolute;
      left: 86px;
      right: 86px;
      bottom: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      color: rgba(255, 255, 255, 0.84);
      font-size: 26px;
      font-weight: 700;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.26));
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Publicacion Dia del Padre Iglesia El Renuevo">
    <header class="topline">
      <div>Iglesia El Renuevo</div>
      <div class="badge">Día del Padre</div>
    </header>

    <section class="content">
      <p class="eyebrow">Honramos su fe, amor y entrega</p>
      <h1>Feliz día del <span class="accent">padre</span></h1>

      <div class="verse-card">
        <p class="verse">"pero yo y mi casa serviremos a Jehová."</p>
        <div class="reference">Josué 24:15 · RVR1960</div>
      </div>

      <p class="challenge">
        El mayor legado no es solo una casa en pie, sino una familia guiada hacia Dios.
      </p>
    </section>

    <footer class="footer">
      <div class="logo-wrap">
        <img class="logo" src="../../logos/LOGO-EL RENUEVO-R-1.png" alt="Logo Iglesia El Renuevo">
        <span>Movimiento Cristiano y Misionero</span>
      </div>
      <div class="line"></div>
    </footer>
  </main>
</body>
</html>
