<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia para redes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6E1A37}a:hover{color:#4A0F24}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; background: {{accent}}; color: #FFFFFF; font-family: 'Figtree', 'Segoe UI', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="padding: 150px 90px 0; display: flex; flex-direction: column; gap: 28px">
    <div style="font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; opacity: 0.9">Convención Regional Cuyo</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 128px; line-height: 0.95">El menú de cada día, en tu celular</h1>
    <div style="font-size: 44px; font-weight: 500">12 al 14 de noviembre · Mendoza</div>
  </div>

  <div style="margin: 90px auto 0; width: 600px; background: #F3F5F7; color: #23303C; border-radius: 48px; border: 14px solid #23303C; display: flex; flex-direction: column; overflow: hidden">
    <div style="background: #23303C; color: #FFFFFF; padding: 34px 36px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 52px">Menú de hoy</span>
      <span style="font-size: 28px">Viernes 13 de noviembre</span>
    </div>
    <div style="padding: 26px 36px; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6875; font-weight: 700">Almuerzo · Plato principal</span>
        <span style="font-size: 34px; font-weight: 500">Carne al horno</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6875; font-weight: 700">Guarnición <span style="margin-left: 8px; padding: 3px 14px; border-radius: 99px; background: #FBEBC8; color: #7A4E00">Cambió</span></span>
        <span style="font-size: 34px; font-weight: 500">Arroz primavera</span>
      </div>
    </div>
  </div>

  <div style="margin: 80px 90px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px">Buscá el QR en tu mesa</span>
    <span style="font-size: 38px; line-height: 1.35; opacity: 0.92">Y leé la bienvenida de los pastores de Mendoza.</span>
  </div>

  <svg viewBox="0 0 1080 260" width="1080" height="260" style="position: absolute; left: 0; bottom: 0; display: block" aria-hidden="true">
    <polygon points="0,260 0,170 110,90 190,140 320,20 420,120 520,60 630,150 730,40 840,130 940,80 1080,160 1080,260" fill="#FFFFFF" opacity="0.12"></polygon>
    <polygon points="0,260 0,215 150,160 260,200 390,140 530,205 670,150 810,205 950,165 1080,210 1080,260" fill="#FFFFFF" opacity="0.2"></polygon>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E1A37","options":["#6E1A37","#23303C","#2F5D50"]},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6E1A37' };
}
}
</script>
</body>
</html>
