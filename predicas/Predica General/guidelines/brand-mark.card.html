<!-- @dsCard group="Brand" viewport="700x200" name="R mark — variants" subtitle="Green circle · black circle · bare (corner mark)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--cream-deep); }
  .row { display: flex; height: 200px; align-items: center; justify-content: space-around; padding: 0 20px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cell img { height: 120px; width: auto; }
  .lab { font-size: 12px; font-weight: 700; color: var(--ink-70); letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="../assets/mark-green-circle.png" alt="green circle mark" /><span class="lab">R-1 · green</span></div>
    <div class="cell"><img src="../assets/mark-black-circle.png" alt="black circle mark" /><span class="lab">R-3 · black</span></div>
    <div class="cell"><img src="../assets/mark-green.png" alt="bare green mark" /><span class="lab">R-4 · corner</span></div>
  </div>
</body>
</html>
