<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); }
  .row { display: flex; height: 220px; }
  .cell { flex: 1; display: flex; align-items: center; justify-content: center; }
  .cell img { height: 150px; width: auto; }
  .a { background: var(--ink); }
  .b { background: var(--cream); }
</style>
</head>
<body>
  <div class="row">
    <div class="cell a"><img src="../assets/logo-full-on-black.png" alt="El Renuevo on black" /></div>
    <div class="cell b"><img src="../assets/logo-full-on-light.png" alt="El Renuevo on light" /></div>
  </div>
</body>
</html>
