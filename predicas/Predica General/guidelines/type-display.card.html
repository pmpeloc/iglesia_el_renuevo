<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 22px 24px; }
  .spec { font-family: var(--font-display); color: var(--ink); text-transform: uppercase;
          font-size: 96px; line-height: .9; letter-spacing: var(--tracking-display); margin: 0; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-70); margin-top: 12px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="spec">RENUEVO</p>
    <div class="meta">Anton · 400 · uppercase · tracking 0.01em · line-height 0.9</div>
  </div>
</body>
</html>
