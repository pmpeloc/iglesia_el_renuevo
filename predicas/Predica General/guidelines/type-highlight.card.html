<!-- @dsCard group="Type" viewport="700x190" name="Montserrat 800 — Highlight" subtitle="Green marker statements" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 26px 24px; }
  .spec { font-family: var(--font-body); font-weight: 800; color: var(--ink);
          font-size: 50px; line-height: 1.15; margin: 0; }
  .mark { background: var(--green); color: var(--ink);
          padding: var(--highlight-pad-y) var(--highlight-pad-x); box-decoration-break: clone;
          -webkit-box-decoration-break: clone; border-radius: 3px; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-70); margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="spec">No es religión, es <span class="mark">una relación</span></p>
    <div class="meta">Montserrat · 800 · marker = var(--green) behind text</div>
  </div>
</body>
</html>
