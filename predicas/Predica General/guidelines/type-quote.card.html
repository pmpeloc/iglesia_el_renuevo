<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); }
  .wrap { padding: 28px 30px; }
  .q { font-family: var(--font-quote); font-style: italic; font-weight: 500;
       color: var(--cream); font-size: 40px; line-height: 1.25; margin: 0; max-width: 620px; }
  .ref { font-family: var(--font-body); font-weight: 700; text-transform: uppercase;
         letter-spacing: .18em; font-size: 14px; color: var(--green); margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="q">“De modo que si alguno está en Cristo, nueva criatura es.”</p>
    <div class="ref">2 Corintios 5:17</div>
  </div>
</body>
</html>
