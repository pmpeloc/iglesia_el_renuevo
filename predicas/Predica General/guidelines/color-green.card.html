<!-- @dsCard group="Colors" viewport="700x150" name="Green states" subtitle="Accent press / base / hover" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; height: 110px; border-radius: var(--radius-sm);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
  .name { font-weight: 800; font-size: 13px; letter-spacing: .04em; color: var(--ink); }
  .hex { font-size: 12px; color: var(--ink); opacity: .75; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--green-deep);"><span class="name">GREEN&nbsp;DEEP</span><span class="hex">#4A9E22 · press</span></div>
    <div class="sw" style="background: var(--green);"><span class="name">GREEN</span><span class="hex">#5DBE2C · base</span></div>
    <div class="sw" style="background: var(--green-bright);"><span class="name">GREEN&nbsp;BRIGHT</span><span class="hex">#6FD635 · hover</span></div>
  </div>
</body>
</html>
