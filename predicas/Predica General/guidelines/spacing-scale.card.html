<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="8px base · slide margins 120/96" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; font-family: var(--font-body); }
  .wrap { padding: 22px 24px; display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--green); border-radius: 3px; width: 30px; }
  .lab { font-size: 11px; color: var(--ink-70); font-variant-numeric: tabular-nums; }
  .tok { font-size: 11px; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="height:8px"></div><span class="tok">1</span><span class="lab">8</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="tok">2</span><span class="lab">16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="tok">3</span><span class="lab">24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="tok">4</span><span class="lab">32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="tok">5</span><span class="lab">48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="tok">6</span><span class="lab">64</span></div>
    <div class="col"><div class="bar" style="height:96px"></div><span class="tok">7</span><span class="lab">96</span></div>
  </div>
</body>
</html>
