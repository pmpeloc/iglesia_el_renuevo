<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); }
  .wrap { padding: 24px; }
  .body { font-family: var(--font-body); font-weight: 400; color: var(--ink);
          font-size: 28px; line-height: 1.45; margin: 0 0 14px; max-width: 600px; }

            letter-spacing: .22em; font-size: 15px; color: var(--green-deep); margin: 0 0 12px; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-70); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Punto 01 · Reunión General</p>
    <p class="body">El cuerpo lleva Montserrat regular, con interlínea amplia para lectura cómoda a distancia.</p>
    <div class="meta">Body 400 · 1.45 lh · Kicker 700 · uppercase · 0.22em</div>
  </div>
</body>
</html>
