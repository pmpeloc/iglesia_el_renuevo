<!-- @dsCard group="Slides" viewport="1920x1080" name="Subpunto" subtitle="Two columns — text left, image right" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  .slide {
    position: relative; width: 1920px; height: 1080px; box-sizing: border-box;
    background: var(--cream); color: var(--ink);
    display: grid; grid-template-columns: 1fr 760px; font-family: var(--font-body); overflow: hidden;
  }
  .corner { position: absolute; top: 56px; right: 64px; height: 80px; width: auto; z-index: 2; }
  .col-text {
    padding: var(--slide-margin-y) var(--space-7) var(--slide-margin-y) var(--slide-margin-x);
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-kicker);
    font-size: 34px; color: var(--green-deep); margin: 0 0 var(--space-3);
  }
  .h2 {
    font-family: var(--font-body); font-weight: 800; font-size: var(--fs-h2);
    line-height: var(--leading-tight); margin: 0 0 var(--space-4); max-width: 900px;
  }
  .mark { background: var(--green); color: var(--ink); padding: 0 0.08em;
          box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .body { font-weight: 600; font-size: 38px; line-height: var(--leading-body);
          color: var(--ink); margin: 0; max-width: 820px; }
  ul { margin: var(--space-3) 0 0; padding: 0; list-style: none; }
  li { font-weight: 600; font-size: 36px; line-height: 1.5; padding-left: 38px; position: relative; margin-bottom: var(--space-2); }
  li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 18px; height: 18px;
               background: var(--green); border-radius: 4px; }
  /* image placeholder */
  .col-img { position: relative; background: var(--ink); display: flex;
             align-items: center; justify-content: center; }
  .ph { color: var(--cream-40); font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.22em; font-size: var(--fs-small); }
  .col-img img.markbig { position: absolute; height: 220px; opacity: 0.12; }
</style>
</head>
<body>
  <div class="slide">
    <img class="corner" src="../assets/mark-green.png" alt="El Renuevo" />
    <div class="col-text">
      <p class="kicker">Punto 01 · a</p>
      <h2 class="h2">El amor que <span class="mark">se enfría</span> con la rutina</h2>
      <p class="body">La fe no muere de golpe; se apaga en lo cotidiano cuando dejamos de cultivarla.</p>
      <ul>
        <li>Servir sin presencia</li>
        <li>Orar sin intimidad</li>
        <li>Conocer sin obedecer</li>
      </ul>
    </div>
    <div class="col-img">
      <img class="markbig" src="../assets/mark-green-circle.png" alt="" />
      <span class="ph">Imagen</span>
    </div>
  </div>
</body>
</html>
