<!-- @dsCard group="Slides" viewport="1920x1080" name="Título de punto" subtitle="Cream bg, giant number + Anton point title" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  .slide {
    position: relative; width: 1920px; height: 1080px; box-sizing: border-box;
    background: var(--cream); color: var(--ink);
    padding: var(--slide-margin-y) var(--slide-margin-x);
    display: flex; flex-direction: column; justify-content: center;
    font-family: var(--font-body); overflow: hidden;
  }
  .corner { position: absolute; top: 56px; right: 64px; height: 88px; width: auto; }
  .num {
    font-family: var(--font-display); font-size: 360px; line-height: 0.8;
    color: var(--green); margin: 0 0 var(--space-2); letter-spacing: 0;
  }
  .kicker {
    font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-kicker);
    font-size: 48px; color: var(--green-deep); margin: 0 0 var(--space-3);
  }
  .title {
    font-family: var(--font-display); text-transform: uppercase;
    font-size: var(--fs-title); line-height: var(--leading-display);
    letter-spacing: var(--tracking-display); margin: 0; max-width: 1400px;
  }
  .rule { width: 140px; height: var(--border-2); background: var(--ink); margin-top: var(--space-5); }
</style>
</head>
<body>
  <div class="slide">
    <img class="corner" src="../assets/mark-green.png" alt="El Renuevo" />
    <div class="num">01</div>
    <p class="kicker">Primer Punto</p>
    <h1 class="title">Un corazón<br />que recuerda</h1>
    <div class="rule"></div>
  </div>
</body>
</html>
