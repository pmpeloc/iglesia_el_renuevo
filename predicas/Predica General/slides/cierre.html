<!-- @dsCard group="Slides" viewport="1920x1080" name="Cierre" subtitle="Closing — ink bg, mark, framing quote" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  .slide {
    position: relative; width: 1920px; height: 1080px; box-sizing: border-box;
    background: var(--ink); color: var(--cream);
    padding: var(--slide-margin-y) var(--slide-margin-x);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; font-family: var(--font-body); overflow: hidden;
  }
  .mark { height: 140px; width: auto; margin-bottom: var(--space-5); }
  .quote {
    font-family: var(--font-quote); font-style: italic; font-size: var(--fs-quote);
    line-height: 1.18; margin: 0; max-width: 1600px; color: var(--cream);
  }
  .hl { color: var(--green); font-style: italic; }
  .meeting {
    margin-top: var(--space-5); font-weight: 700; text-transform: uppercase;
    letter-spacing: var(--tracking-kicker); font-size: var(--fs-kicker); color: var(--green);
  }
  .meeting span { color: var(--cream-40); }
</style>
</head>
<body>
  <div class="slide">
    <img class="mark" src="../assets/mark-green.png" alt="Iglesia El Renuevo" />
    <p class="quote">“Acuérdate, pues, de dónde has caído, y <span class="hl">arrepiéntete</span>, y haz las primeras obras.”</p>
    <div class="meeting">Iglesia El Renuevo <span>·</span> MCyM <span>·</span> Reunión General</div>
  </div>
</body>
</html>
