<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;overflow:hidden;font-family:Montserrat,sans-serif;color:#fff;
    background:linear-gradient(180deg,#0b1020 0%,#1c2340 30%,#6b3a4a 52%,#e0784a 66%,#f6c26b 74%,#2a2a2a 74.1%)}
  .sun{position:absolute;left:50%;top:800px;width:360px;height:360px;margin-left:-180px;border-radius:50%;
    background:radial-gradient(circle,#fff6d8 0%,#ffd479 35%,rgba(255,170,80,.0) 70%)}
  svg{position:absolute;left:0;bottom:0}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.75) 100%)}
  .top{position:absolute;top:70px;width:100%;text-align:center}
  .top img{height:110px}
  .church{margin-top:14px;font-weight:700;letter-spacing:8px;font-size:28px;opacity:.9}
  .tag{display:inline-block;margin-top:56px;padding:12px 30px;border:3px solid #5DBE2C;border-radius:40px;
    color:#5DBE2C;font-weight:800;letter-spacing:6px;font-size:32px;background:rgba(0,0,0,.35)}
  h1{font-family:Anton,sans-serif;font-weight:400;line-height:.95;margin-top:34px;font-size:178px;letter-spacing:2px;
    text-shadow:0 8px 30px rgba(0,0,0,.55)}
  h1 span{color:#5DBE2C}
  .sub{margin-top:22px;font-size:38px;font-weight:500;letter-spacing:1px;text-shadow:0 3px 12px rgba(0,0,0,.6)}
  .bottom{position:absolute;bottom:70px;width:100%;text-align:center}
  .when{display:inline-block;background:#5DBE2C;color:#111;border-radius:22px;padding:22px 50px 18px}
  .day{font-weight:800;font-size:36px;letter-spacing:2px}
  .hour{font-family:Anton,sans-serif;font-size:96px;line-height:1.05}
  .addr{margin-top:28px;font-weight:700;font-size:40px}
  .wait{margin-top:10px;font-size:32px;font-weight:500;opacity:.85}
</style></head><body>
<div class="sun"></div>
<svg width="1080" height="560" viewBox="0 0 1080 560">
  <path d="M0 260 L170 150 L300 230 L460 110 L620 220 L780 130 L930 210 L1080 150 L1080 560 L0 560Z" fill="#3a2f45"/>
  <path d="M0 330 L200 240 L380 320 L560 220 L760 320 L920 250 L1080 310 L1080 560 L0 560Z" fill="#241f30"/>
  <path d="M0 420 L260 350 L520 410 L800 340 L1080 400 L1080 560 L0 560Z" fill="#141219"/>
  <path d="M540 330 C 520 380, 600 400, 560 440 C 520 480, 420 500, 330 560 L 750 560 C 660 500, 600 470, 610 440 C 630 400, 560 380, 548 330Z" fill="#c9905a" opacity=".55"/>
</svg>
<div class="shade"></div>
<div class="top">
  <img src="../../logos/LOGO-EL RENUEVO-R-1.png" alt="">
  <div class="church">IGLESIA EL RENUEVO</div>
  <div class="tag">TALLER EN EQUIPO</div>
  <h1>PERSISTIR<br><span>DE VERDAD</span></h1>
  <div class="sub">Nehemías · La viuda · Elías</div>
</div>
<div class="bottom">
  <div class="when"><div class="day">HOY · JUEVES 1 DE OCTUBRE</div><div class="hour">20:30 HS</div></div>
  <div class="addr">República de Siria 255, Perico</div>
  <div class="wait">¡Te esperamos!</div>
</div>
</body></html>
