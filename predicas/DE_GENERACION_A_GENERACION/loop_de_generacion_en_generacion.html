<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De generación a generación — Iglesia El Renuevo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050F07;
    font-family: 'Georgia', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* ── Radial light glow ── */
  .glow {
    position: fixed;
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(93,190,44,0.12) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
  }

  /* ── SVG tree ── */
  .tree-wrap {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    z-index: 2;
    opacity: 0.18;
  }

  /* ── Main content ── */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Tag above title ── */
  .tag {
    font-family: 'Arial', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #5DBE2C;
    margin-bottom: 24px;
    animation: fadeSlideIn 2s ease both;
    opacity: 0;
  }

  /* ── Main title ── */
  .title {
    font-size: clamp(5rem, 10vw, 9rem);
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.1;
    color: #FFFFFF;
    text-shadow: 0 0 60px rgba(93,190,44,0.35);
    animation: fadeSlideIn 2.2s ease 0.3s both;
    opacity: 0;
  }

  .title span {
    color: #5DBE2C;
    font-style: italic;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 32px 0 28px;
    animation: fadeSlideIn 2.2s ease 0.6s both;
    opacity: 0;
  }

  .divider-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(to right, transparent, #5DBE2C);
  }
  .divider-line.right {
    background: linear-gradient(to left, transparent, #5DBE2C);
  }

  .divider-icon {
    width: 28px;
    height: 28px;
    opacity: 0.85;
  }

  /* ── Verse ── */
  .verse-box {
    max-width: 760px;
    padding: 28px 40px;
    border: 1px solid rgba(93,190,44,0.3);
    border-radius: 4px;
    background: rgba(93,190,44,0.05);
    backdrop-filter: blur(4px);
    animation: fadeSlideIn 2.2s ease 0.9s both;
    opacity: 0;
  }

  .verse-text {
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-style: italic;
    color: rgba(255,255,255,0.88);
    line-height: 1.7;
    letter-spacing: 0.01em;
  }

  .verse-ref {
    margin-top: 18px;
    font-family: 'Arial', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #5DBE2C;
  }

  /* ── Logo ── */
  .logo {
    position: fixed;
    top: 36px;
    right: 48px;
    width: 68px;
    z-index: 20;
    opacity: 0.75;
    animation: fadeSlideIn 2.2s ease 1.4s both;
  }

  /* ── Floating particles (CSS fallback) ── */
  .particle {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #5DBE2C;
    opacity: 0;
    animation: float linear infinite;
    z-index: 3;
  }

  @keyframes float {
    0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.45; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Canvas background: starfield + organic light -->
<canvas id="bg"></canvas>
<div class="glow"></div>

<!-- Generational tree silhouette -->
<div class="tree-wrap">
  <svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" fill="none">
    <!-- Trunk -->
    <path d="M350 500 C350 400 340 320 350 250" stroke="#5DBE2C" stroke-width="18" stroke-linecap="round"/>
    <!-- Main branches -->
    <path d="M350 320 C310 280 260 260 200 240" stroke="#5DBE2C" stroke-width="10" stroke-linecap="round"/>
    <path d="M350 320 C390 280 440 260 500 240" stroke="#5DBE2C" stroke-width="10" stroke-linecap="round"/>
    <path d="M350 280 C330 240 300 210 270 190" stroke="#5DBE2C" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 280 C370 240 400 210 430 190" stroke="#5DBE2C" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 250 C350 200 345 160 350 120" stroke="#5DBE2C" stroke-width="12" stroke-linecap="round"/>
    <!-- Upper branches -->
    <path d="M350 200 C320 165 290 150 250 135" stroke="#5DBE2C" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 200 C380 165 410 150 450 135" stroke="#5DBE2C" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 155 C340 120 330 100 320 75"  stroke="#5DBE2C" stroke-width="5" stroke-linecap="round"/>
    <path d="M350 155 C360 120 370 100 380 75"  stroke="#5DBE2C" stroke-width="5" stroke-linecap="round"/>
    <path d="M350 120 C350 90  348 65  350 40"  stroke="#5DBE2C" stroke-width="6" stroke-linecap="round"/>
    <!-- Root branches -->
    <path d="M350 460 C310 455 270 470 230 460" stroke="#5DBE2C" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 460 C390 455 430 470 470 460" stroke="#5DBE2C" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 480 C310 478 280 490 240 485" stroke="#5DBE2C" stroke-width="5" stroke-linecap="round"/>
    <path d="M350 480 C390 478 420 490 460 485" stroke="#5DBE2C" stroke-width="5" stroke-linecap="round"/>
    <path d="M310 465 C290 475 265 482 240 478" stroke="#5DBE2C" stroke-width="4" stroke-linecap="round"/>
    <path d="M390 465 C410 475 435 482 460 478" stroke="#5DBE2C" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>

<!-- Leaf particles -->
<script>
  // Generate CSS leaf particles
  const body = document.body;
  const count = 22;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 6;
    const left = Math.random() * 100;
    const dur  = 12 + Math.random() * 20;
    const del  = Math.random() * -25;
    p.style.cssText = `
      left:${left}vw;
      width:${size}px; height:${size * 1.6}px;
      border-radius: 50% 0 50% 0;
      animation-duration:${dur}s;
      animation-delay:${del}s;
    `;
    body.appendChild(p);
  }
</script>

<!-- Main content -->
<div class="content">
  <p class="tag">Iglesia El Renuevo &nbsp;·&nbsp; Reunión Especial</p>

  <h1 class="title">
    De <span>generación</span><br>a generación
  </h1>

  <div class="divider">
    <div class="divider-line"></div>
    <svg class="divider-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Leaf icon -->
      <path d="M14 26 C14 26 4 20 4 12 C4 7 8.5 3 14 3 C19.5 3 24 7 24 12 C24 20 14 26 14 26Z"
            fill="rgba(93,190,44,0.2)" stroke="#5DBE2C" stroke-width="1.5"/>
      <line x1="14" y1="26" x2="14" y2="10" stroke="#5DBE2C" stroke-width="1.5"/>
      <path d="M14 17 C11 14 8 13 6 13" stroke="#5DBE2C" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M14 14 C17 11 20 10 22 10" stroke="#5DBE2C" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <div class="divider-line right"></div>
  </div>

  <div class="verse-box">
    <p class="verse-text">
      "No las encubriremos a sus hijos,<br>
      contando a la generación venidera las alabanzas de Jehová,<br>
      y su potencia, y las maravillas que hizo."
    </p>
    <p class="verse-ref">Salmo 78:4 — RVR60</p>
  </div>
</div>

<!-- Logo -->
<img class="logo" src="./logos/LOGO-EL RENUEVO-R-4.png" alt="El Renuevo" onerror="this.style.display='none'">

<script>
// ── Canvas: organic dark background with subtle bokeh ──
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

let W, H, dots;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initDots();
}

function initDots() {
  dots = Array.from({ length: 80 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 1 + Math.random() * 3,
    sp: 0.15 + Math.random() * 0.3,
    a: Math.random() * Math.PI * 2,
    op: 0.04 + Math.random() * 0.18
  }));
}

function drawBg() {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
  grad.addColorStop(0,   '#0D2A12');
  grad.addColorStop(0.5, '#071508');
  grad.addColorStop(1,   '#020804');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

let t = 0;
function frame() {
  t += 0.004;
  ctx.clearRect(0, 0, W, H);
  drawBg();

  dots.forEach(d => {
    d.x += Math.cos(d.a) * d.sp;
    d.y += Math.sin(d.a) * d.sp * 0.4 - 0.12;
    d.a += 0.005;
    if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
    if (d.x < -10) d.x = W + 10;
    if (d.x > W+10) d.x = -10;

    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(93,190,44,${d.op})`;
    ctx.fill();
  });

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
frame();
</script>

</body>
</html>
